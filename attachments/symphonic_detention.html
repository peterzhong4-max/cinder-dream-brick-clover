        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // ==========================================
        // 1. GLOBALS & MAPS
        // ==========================================
        const MAP_WIDTH = 3000; const MAP_HEIGHT = 3000;
        function getDistance(x1, y1, x2, y2) { return Math.sqrt((x2-x1)**2 + (y2-y1)**2); }
        function getMapWalls(levelId) {
          const w = [ {id: 'bw1', x:0,y:0,w:MAP_WIDTH,h:40, isBorder: true}, {id: 'bw2', x:0,y:MAP_HEIGHT-40,w:MAP_WIDTH,h:40, isBorder: true}, {id: 'bw3', x:0,y:0,w:40,h:MAP_HEIGHT, isBorder: true}, {id: 'bw4', x:MAP_WIDTH-40,y:0,w:40,h:MAP_HEIGHT, isBorder: true} ];
          if (levelId === 'm_eason_1') { 
              w.push({id: 'iw1', x:0,y:600,w:1200,h:40, hp: 500, maxHp: 500}, {id: 'iw2', x:1800,y:600,w:1200,h:40, hp: 500, maxHp: 500}); 
              for(let i=0; i<8; i++) w.push({id: `iw3_${i}`, x:400,y:1200+i*200,w:800,h:40, hp: 300, maxHp: 300}, {id: `iw4_${i}`, x:1800,y:1200+i*200,w:800,h:40, hp: 300, maxHp: 300}); 
          } else { 
              w.push({id: 'iw5', x:1000,y:40,w:40,h:800, hp: 600, maxHp: 600}, {id: 'iw6', x:2000,y:2160,w:40,h:800, hp: 600, maxHp: 600}, {id: 'iw7', x:40,y:2000,w:800,h:40, hp: 600, maxHp: 600}, {id: 'iw8', x:2160,y:1000,w:800,h:40, hp: 600, maxHp: 600}); 
              for(let i=1; i<5; i++) for(let j=1; j<5; j++) { if ((i===2&&j===2)||(i===3&&j===3)||(i===2&&j===3)||(i===3&&j===2)) continue; w.push({id: `gridx_${i}_${j}`, x:i*600, y:j*600-100, w:40, h:200, hp: 400, maxHp: 400}, {id: `gridy_${i}_${j}`, x:i*600-100, y:j*600, w:200, h:40, hp: 400, maxHp: 400}); } 
          }
          return w;
        }
        function getCollidedWalls(x, y, r, walls) { return walls ? walls.filter(w => x+r > w.x && x-r < w.x+w.w && y+r > w.y && y-r < w.y+w.h) : []; }
        function checkWallCollision(x, y, r, ign = false, walls = []) { if (x-r < 0 || x+r > MAP_WIDTH || y-r < 0 || y+r > MAP_HEIGHT) return true; if (ign) return false; return getCollidedWalls(x, y, r, walls).length > 0; }

        // ==========================================
        // 2. AUDIO SYNTHESIZER
        // ==========================================
        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        function playSynthesizer(freq, instId) {
          if (!audioCtx) return;
          const now = audioCtx.currentTime; const mGain = audioCtx.createGain(); const filter = audioCtx.createBiquadFilter(); const osc = audioCtx.createOscillator();
          osc.connect(filter); filter.connect(mGain); mGain.connect(audioCtx.destination);
          const inst = INSTRUMENTS[instId] || INSTRUMENTS.toot; let dur = 0.5;
          switch (inst.family) {
            case 'flute': osc.type='sine'; filter.type='lowpass'; filter.frequency.value=4000; if(instId==='piccolo')freq*=2; dur=0.6; break;
            case 'clarinet': case 'bassClarinet': osc.type='square'; filter.type='lowpass'; filter.frequency.value=freq*3; if(instId==='bassClarinet')freq/=2; dur=0.5; break;
            case 'oboe': case 'bassoon': osc.type='sawtooth'; filter.type='bandpass'; filter.frequency.value=1000; if(instId==='bassoon'||instId==='contrabassOboe')freq/=2; if(instId==='contrabassoon'||instId==='contrabassBassoon')freq/=4; dur=0.6; break;
            case 'sax': case 'sax_straight': osc.type='sawtooth'; filter.type='lowpass'; filter.frequency.setValueAtTime(freq,now); filter.frequency.linearRampToValueAtTime(freq*4,now+0.05); if(instId==='sopranoSax')freq*=1.5; if(instId==='tenorSax')freq/=1.5; if(instId==='baritoneSax')freq/=2.5; if(instId==='contrabassSax')freq/=4; dur=0.6; break;
            case 'trumpet': case 'trombone': case 'horn': case 'tuba': case 'sousaphone': osc.type=(inst.family==='horn')?'triangle':'sawtooth'; filter.type='lowpass'; filter.frequency.setValueAtTime(0.001,now); filter.frequency.exponentialRampToValueAtTime(freq*8,now+0.08); if(instId.toLowerCase().includes('trombone'))freq/=2; if(instId.includes('contrabassTrombone'))freq/=4; if(instId==='tuba'||instId==='sousaphone')freq/=4; dur=0.6; break;
            case 'triangle': osc.type='sine'; freq*=4; dur=1.0; break;
            case 'gun': osc.type='square'; freq=50; dur=0.2; break;
            case 'throwable': osc.type='sine'; freq=800; dur=0.2; break;
            default: osc.type='square'; dur=0.5;
          }
          mGain.gain.setValueAtTime(0, now); mGain.gain.linearRampToValueAtTime(0.5, now+0.05); mGain.gain.exponentialRampToValueAtTime(0.001, now+dur);
          if(!['gun','throwable'].includes(inst.family)) osc.frequency.setValueAtTime(freq, now);
          osc.start(now); osc.stop(now + dur);
        }

id" cx="50%" cy="50%" r="50%"><stop offset="0%" stopColor="#bef264" /><stop offset="100%" stopColor="#4d7c0f" /></radialGradient><radialGradient id="eggGrad" cx="30%" cy="30%" r="70%"><stop offset="0%" stopColor="#fff" /><stop offset="100%" stopColor="#e5e5e5" /></radialGradient></defs>;

              <g stroke="#000" strokeWidth={gt==='thick'?"5":"3"} fill="none">
                {gt==='round' && <><circle cx="38" cy="40" r="8"/><circle cx="62" cy="40" r="8"/><line x1="46" y1="40" x2="54" y2="40"/><line x1="30" y1="40" x2="22" y2="35"/><line x1="70" y1="40" x2="78" y2="35"/></>}
                {gt==='square' && <><rect x="30" y="32" width="16" height="16"/><rect x="54" y="32" width="16" height="16"/><line x1="46" y1="40" x2="54" y2="40"/><line x1="30" y1="40" x2="22" y2="35"/><line x1="70" y1="40" x2="78" y2="35"/></>}

        // ==========================================
        // 5. MAIN APP & REACT VIEWS
        // ==========================================
        function App() {
          const [view, setView] = useState('menu'); 
          const [activeChar, setActiveChar] = useState(CHARACTERS[0]);
          const [reeds, setReeds] = useState(0);
          const [unlockedInstruments, setUnlockedInstruments] = useState(['toot', 'dood']);
          const [unlockedCharacters, setUnlockedCharacters] = useState(['rocky', 'melody', 'harmony', 'rhythm']);
          const [maxLevelUnlocked, setMaxLevelUnlocked] = useState(1);
          const [currentLevel, setCurrentLevel] = useState(null);
          const [gameStats, setGameStats] = useState({ goonsKilled: 0, thugsKilled: 0, soundproofersKilled: 0, bossesDefeated: 0 });
          const [claimedQuests, setClaimedQuests] = useState([]);
          const [upgrades, setUpgrades] = useState({ toot: { damageLvl: 0, breathLvl: 0, hitsLvl: 0 }, dood: { damageLvl: 0, breathLvl: 0, hitsLvl: 0 } });
          const [charUpgrades, setCharUpgrades] = useState({});
          const [cheatsEnabled, setCheatsEnabled] = useState(false);

          const navigate = useCallback((newView) => { initAudio(); setView(newView); }, []);
          const addReeds = useCallback((amount) => setReeds(c => c + amount), []);
          const unlockLevelProgression = useCallback((levelId) => { if (typeof levelId === 'number') setMaxLevelUnlocked(prev => (levelId === prev && levelId < ALL_LEVELS.length) ? levelId + 1 : prev); }, []);
          const syncQuestStats = useCallback((stats) => { setGameStats(prev => ({ goonsKilled: prev.goonsKilled + (stats.goonsKilled || 0), thugsKilled: prev.thugsKilled + (stats.thugsKilled || 0), soundproofersKilled: prev.soundproofersKilled + (stats.soundproofersKilled || 0), bossesDefeated: prev.bossesDefeated + (stats.bossesDefeated || 0) })); }, []);

          const claimQuest = useCallback((quest) => {
            if (claimedQuests.includes(quest.id)) return;
            setClaimedQuests(prev => [...prev, quest.id]);
            if (quest.rewardType === 'instrument') {
               if (!unlockedInstruments.includes(quest.rewardId)) { setUnlockedInstruments(prev => [...prev, quest.rewardId]); setUpgrades(prev => ({ ...prev, [quest.rewardId]: { damageLvl: 0, breathLvl: 0, hitsLvl: 0 } })); }
            } else if (quest.rewardType === 'reeds') { addReeds(quest.rewardAmount); }
          }, [claimedQuests, unlockedInstruments, addReeds]);

          const buyItem = useCallback((type, id, cost) => {
            setReeds(currentReeds => {
              if (currentReeds >= cost) {
                if (type === 'upgradeDmg') setUpgrades(prev => ({ ...prev, [id]: { ...prev[id], damageLvl: (prev[id]?.damageLvl || 0) + 1 } }));
                if (type === 'upgradeBrth') setUpgrades(prev => ({ ...prev, [id]: { ...prev[id], breathLvl: (prev[id]?.breathLvl || 0) + 1 } }));
                if (type === 'upgradeHits') setUpgrades(prev => ({ ...prev, [id]: { ...prev[id], hitsLvl: (prev[id]?.hitsLvl || 0) + 1 } }));
                if (type === 'charUpgHp') setCharUpgrades(prev => ({ ...prev, [id]: { ...prev[id], hp: (prev[id]?.hp || 0) + 1 } }));
                if (type === 'charUpgDmg') setCharUpgrades(prev => ({ ...prev, [id]: { ...prev[id], dmg: (prev[id]?.dmg || 0) + 1 } }));
                if (type === 'charUpgBreath') setCharUpgrades(prev => ({ ...prev, [id]: { ...prev[id], breath: (prev[id]?.breath || 0) + 1 } }));
                if (type === 'instrument') { if (!unlockedInstruments.includes(id)) { setUnlockedInstruments(prev => [...prev, id]); setUpgrades(prev => ({ ...prev, [id]: { damageLvl: 0, breathLvl: 0, hitsLvl: 0 } })); } }
                if (type === 'character') { if (!unlockedCharacters.includes(id)) setUnlockedCharacters(prev => [...prev, id]); }
                return currentReeds - cost;
              }
              return currentReeds;
            });
          }, [unlockedInstruments, unlockedCharacters]);

          const unlockAll = useCallback(() => {
             setUnlockedCharacters(CHARACTERS.map(c => c.id));
             setUnlockedInstruments(Object.keys(INSTRUMENTS).filter(k => k !== 'egg'));
             Object.keys(INSTRUMENTS).forEach(k => { if(k !== 'egg') setUpgrades(prev => ({ ...prev, [k]: prev[k] || { damageLvl: 0, breathLvl: 0, hitsLvl: 0 } })); });
          }, []);

          return (

                <div className="bg-slate-950 p-4 border-b border-slate-700 flex justify-between items-center shrink-0 z-20">
                  <div className="flex items-center gap-2"><Ic n="music" c="text-cyan-400" /><h1 className="text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">SYMPHONIC DETENTION</h1></div>

                </div>

                  {view === 'chars' && <CharSelect activeChar={activeChar} setActiveChar={setActiveChar} unlockedCharacters={unlockedCharacters} navigate={navigate} />}
                  {view === 'shop' && <ShopView unlockedInstruments={unlockedInstruments} unlockedCharacters={unlockedCharacters} upgrades={upgrades} buyItem={buyItem} reeds={reeds} isBlackMarketAvailable={false} charUpgrades={charUpgrades} activeChar={activeChar} />}
                  {view === 'missions' && <MissionsView gameStats={gameStats} claimedQuests={claimedQuests} claimQuest={claimQuest} navigate={navigate} setCurrentLevel={setCurrentLevel} />}
                  {view === 'levelSelect' && <LevelSelect maxLevelUnlocked={maxLevelUnlocked} setCurrentLevel={setCurrentLevel} navigate={navigate} />}
                  {view === 'game' && <GameEngine level={currentLevel} character={activeChar} unlockedInstruments={unlockedInstruments} upgrades={upgrades} charUpgrades={charUpgrades} navigate={navigate} unlockLevelProgression={unlockLevelProgression} addReeds={addReeds} syncQuestStats={syncQuestStats} reeds={reeds} buyItem={buyItem} unlockedCharacters={unlockedCharacters} cheatsEnabled={cheatsEnabled} />}
                  {view === 'town' && <TownEngine unlockedCharacters={unlockedCharacters} navigate={navigate} reeds={reeds} buyItem={buyItem} charUpgrades={charUpgrades} activeChar={activeChar} />}
                  {view === 'secret' && <SecretView navigate={navigate} addReeds={addReeds} unlockAll={unlockAll} setCheatsEnabled={setCheatsEnabled} />}
                  {view === 'win' && <WinView level={currentLevel} navigate={navigate} />}

        function TutorialView({ navigate }) {

                  {s.enemies.map(e => {
                     if (e.isBoss) return (<div key={e.id} className="absolute flex items-center justify-center transition-transform" style={{ left: e.x - e.radius, top: e.y - e.radius, width: e.radius*2, height: e.radius*2 }}><TeacherSVG glassesType={level.glassesType} shirtColor={level.shirtColor} isHit={false} /><div className="absolute -top-4 w-16 h-2 bg-slate-800 rounded"><div className="h-full bg-red-500 rounded" style={{ width: `${Math.max(0, e.hp/e.maxHp)*100}%` }}/></div></div>);
                     return (<div key={e.id} className="absolute rounded-full shadow-lg flex items-center justify-center" style={{ left: e.x - e.radius, top: e.y - e.radius, width: e.radius*2, height: e.radius*2 }}><CustomEnemySVG typeId={e.typeId} isHit={false} /><div className="absolute -top-3 w-10 h-1 bg-slate-800 rounded"><div className="h-full bg-red-500 rounded" style={{ width: `${Math.max(0, e.hp/e.maxHp)*100}%` }}/></div></div>)
                  })}

                  {s.allies.map(a => (
                     <div key={a.id} className="absolute rounded-full shadow-lg flex items-center justify-center" style={{ left: a.x - a.radius, top: a.y - a.radius, width: a.radius*2, height: a.radius*2 }}>
                        <CustomEnemySVG typeId="ally" isHit={false} />
                        <div className="absolute -top-3 w-10 h-1 bg-slate-800 rounded"><div className="h-full bg-blue-500 rounded" style={{ width: `${Math.max(0, a.hp/a.maxHp)*100}%` }}/></div>
                     </div>
                  ))}

                  <div className="absolute transition-transform duration-75" style={{ left: s.player.x - 50, top: s.player.y - 50, width: 100, height: 100, transform: `rotate(${s.player.angle * 180 / Math.PI}deg)` }}>
                     {s.player.isInvincible && <div className="absolute inset-0 rounded-full border-4 border-yellow-400 animate-ping opacity-50"/>}
                     <CustomPlayerSVG character={character} instrumentId={activeInstrument} isPlaying={s.player.isPlaying} isWalking={s.player.isWalking} zOffset={s.player.z} />
                  </div>

                  {s.projectiles.map(p => {
                     const isNonSpinning = p.orbiter || p.shape === 'bullet' || p.shape === 'dog';
                     return (<div key={p.id} className={`absolute drop-shadow-md ${isNonSpinning ? '' : 'animate-spin-note'}`} style={{ left: p.x - 20, top: p.y - 20, width: 40, height: 40 }}><RenderShape shape={p.shape} colorClass={`text-${p.color}-400`} hexColor={p.color === 'yellow' ? '#facc15' : '#fff'} /></div>);
                  })}
                  {s.enemyProjectiles.map(p => (<div key={p.id} className="absolute drop-shadow-[0_0_8px_rgba(239,68,68,0.8)] animate-spin-note" style={{ left: p.x - 15, top: p.y - 15, width: 30, height: 30 }}><RenderShape shape={p.isFootball ? 'football' : 'note'} colorClass="text-red-500" /></div>))}
                  {s.particles.map((p, i) => (<div key={i} className={`absolute drop-shadow-sm font-bold opacity-${Math.floor(p.life*100)}`} style={{ left: p.x - 15, top: p.y - 15, width: 30, height: 30, transform: `scale(${p.scale||1})` }}><RenderShape shape={p.shape} colorClass={`text-${p.color}-400`} /></div>))}
                </div>
              </div>

              <div className="absolute top-4 left-4 right-4 flex justify-between pointer-events-none">
                 <div className="w-48 bg-slate-800/90 p-3 rounded-xl border border-green-900/50 backdrop-blur-sm pointer-events-auto shadow-xl">
                   <div className="flex justify-between items-center mb-1"><span className="text-xs font-bold text-green-400 flex items-center gap-1"><Ic n="heart" s={12}/> HP</span><span className="text-xs">{Math.ceil(hudHp)} / {Math.ceil(s.player.maxHp)}</span></div>
                   <div className="h-3 w-full bg-slate-900 rounded-full overflow-hidden"><div className="h-full bg-green-500 transition-all duration-200" style={{ width: `${Math.max(0, (hudHp / s.player.maxHp) * 100)}%` }} /></div>
                   <div className="flex justify-between items-center mt-2 mb-1"><span className="text-xs font-bold text-cyan-400 flex items-center gap-1"><Ic n="wind" s={12}/> Breath</span></div>
                   <div className="h-3 w-full bg-slate-900 rounded-full overflow-hidden"><div className="h-full bg-cyan-400 transition-all duration-75" style={{ width: `${hudBreath}%` }} /></div>
                 </div>

                 {bossActive && (<div className="w-64 bg-slate-900/90 p-3 rounded-xl border border-red-900/50 backdrop-blur-sm pointer-events-auto text-center shadow-xl"><h3 className="font-bold text-red-400">{level.teacher}</h3><p className="text-xs text-slate-400 mb-2">{level.subject}</p><div className="h-4 w-full bg-slate-800 rounded-full overflow-hidden border border-slate-700"><div className="h-full bg-red-500 transition-all duration-200" style={{ width: `${Math.max(0, (hudBossHp / level.hp) * 100)}%` }} /></div></div>)}
                 {s.door && (<div className="bg-slate-900/90 p-3 rounded-xl border border-green-500/50 backdrop-blur-sm pointer-events-auto text-center shadow-xl h-14"><h3 className="font-bold text-green-400 flex items-center gap-2"><Ic n="zap" s={16}/> Find the Door!</h3></div>)}

                 <div className="flex flex-col items-end gap-2 pointer-events-auto">
                   <div className="bg-slate-800/80 p-2 px-4 rounded-xl text-sm font-bold shadow-lg text-amber-400 border border-amber-900/50 flex gap-2 items-center">{bossActive ? (level.bossBehavior === 'speech' ? "Sneak past to drop the egg!" : "Defeat the Boss!") : s.door ? "Detention Over!" : `Survive Henchmen: ${level.henchmenCount - s.henchmenSpawned} left`}<span className="text-xs text-slate-400 bg-slate-900 px-2 py-1 rounded">(Esc) Pause</span></div>
                   <div className="flex gap-2 bg-slate-800/80 p-2 rounded-xl backdrop-blur-sm shadow-xl max-w-sm overflow-x-auto custom-scrollbar">
                      {unlockedInstruments.map((instId, idx) => {
                        const inst = INSTRUMENTS[instId];
                        if (inst.family === 'throwable' && level.id !== 'm_eason_1') return null; 
                        return (
                          <button key={instId} onClick={() => { if(level.id !== 'm_eason_1') setActiveInstrument(instId); }} className={`shrink-0 w-14 h-14 rounded-lg flex flex-col items-center justify-center transition-all relative ${activeInstrument === instId ? `ring-2 ring-white scale-110 ${inst.color}` : 'bg-slate-700 opacity-60 hover:opacity-100'}`} title={`${inst.name} (Cost: ${inst.breathCost})`}>
                            <span className="absolute top-0 right-1 text-[10px] font-bold opacity-75">{idx+1}</span>
                            <div className="w-8 h-8"><RenderShape shape={inst.family === 'gun' ? 'bullet' : inst.family} hexColor={inst.color.includes('white') ? '#fff' : '#000'} /></div>
                          </button>
                        )
                      })}
                   </div>
                 </div>
              </div>

              <div className="h-48 bg-slate-950 p-4 relative shrink-0 z-10 border-t border-slate-700">
                <div className="text-center text-xs text-slate-500 mb-2 font-mono flex items-center justify-center gap-2"><Ic n="volume" s={14}/> Use ARROW KEYS to move. Click keys or type (T-Y-U-I...) to play. Shift to Sprint. Space to Jump. Q for Secret Ability.</div>
                <div className="flex h-full max-h-32 justify-center gap-1 relative px-8">
                  {NOTES.filter(n => !n.isBlack).map((note) => (<div key={note.name} onMouseDown={() => playNote(note)} className={`flex-1 max-w-[60px] bg-white rounded-b-md border-x border-b border-slate-300 relative cursor-pointer select-none transition-colors duration-75 flex items-end justify-center pb-2 text-slate-400 font-bold text-sm ${activeKeys.has(note.key) ? 'bg-slate-300' : 'hover:bg-slate-100'}`}>{note.key.toUpperCase()}</div>))}
                  <div className="absolute top-0 left-0 right-0 h-[60%] flex justify-center gap-1 px-8 pointer-events-none">
                     {NOTES.map((note, i) => {
                       if (!note.isBlack) return <div key={`spacer-${i}`} className="flex-1 max-w-[60px] opacity-0" />;
                       return (<div key={note.name} className="absolute pointer-events-auto" style={{ left: `calc(2rem + ${[1,2, 4,5,6].indexOf(NOTES.filter(n=>n.isBlack).indexOf(note)) * (100/7)}% + ${(100/7)/2}%)`, width: 'calc(100% / 7 * 0.6)', transform: 'translateX(-50%)' }}><div onMouseDown={() => playNote(note)} className={`w-full h-full bg-slate-900 rounded-b-md border border-slate-950 cursor-pointer select-none transition-colors duration-75 flex items-end justify-center pb-2 text-slate-500 text-xs font-bold ${activeKeys.has(note.key) ? 'bg-slate-700' : 'hover:bg-slate-800'}`}>{note.key.toUpperCase()}</div></div>)
                     })}
                  </div>
                </div>
              </div>
            </div>
          );
        }

        function WinView({ level, navigate }) {
          return (
          <div className="h-full flex flex-col items-center justify-center text-center space-y-6"><div className="w-24 h-24 bg-green-500/20 rounded-full flex items-center justify-center"><Ic n="zap" s={48} c="text-green-400" /></div><h2 className="text-5xl font-black text-white">CLASS DISMISSED!</h2><p className="text-xl text-slate-300">You completed {level.subject}.</p><div className="bg-slate-800 p-6 rounded-2xl border border-green-500/50 mt-8 animate-pulse flex items-center gap-4"><Ic n="wind" s={40} c="text-green-400" /><div className="text-left"><p className="text-sm text-slate-400">Bounty Claimed</p><p className="text-3xl font-bold text-green-400">+{level.reward} Reeds</p></div></div><button onClick={() => navigate('levelSelect')} className="mt-8 bg-cyan-600 text-white px-8 py-3 rounded-full font-bold hover:bg-cyan-500 transition">Next Class</button></div>
        )}
        
        function LoseView({ level, navigate }) {
          return (
          <div className="h-full flex flex-col items-center justify-center text-center space-y-6"><div className="w-24 h-24 bg-red-500/20 rounded-full flex items-center justify-center"><Ic n="shieldAlert" s={48} c="text-red-500" /></div><h2 className="text-5xl font-black text-red-500">DETENTION EXTENDED</h2><p className="text-xl text-slate-300">You failed {level.subject}.</p><button onClick={() => navigate('game')} className="mt-8 bg-red-600 text-white px-8 py-3 rounded-full font-bold hover:bg-red-500 transition">Try Again</button><button onClick={() => navigate('menu')} className="text-slate-400 hover:text-white">Back to Menu</button></div>
        )}

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
